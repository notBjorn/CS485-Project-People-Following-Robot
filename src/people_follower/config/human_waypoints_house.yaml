# Waypoints for the person in turtlebot4_house: one lap through all four rooms
# (scripts/launch_human_waypoints.sh house, used by demo_uwb_house.sh).
#
# House interior 10 x 8 m (world coordinates). Doorways are 0.9 m wide, so the route
# goes straight through the middle of each one. The bedroom and the bathroom each have
# one door: the person walks a loop inside and leaves the way they came in, so they
# never turn back into a robot following behind them.
#
#   y=6 +-----------------------------------+-------------------+
#       | dresser   (-0.1,5)<----(1.7,5)    |  (6.35,5.2)->(7.3,5.2)
#       |   BEDROOM    |   [ bed ]   ^      |      ^  BATH  |  [tub]
#       |          (-0.1,3.1)      (1.7,3.3)|  (6.35,3.5) (7.3,3.6)
#       |              \--->(1.05,2.9)/     |        (7.05,2.9)
#   y=2 +-------------------| door |--------+------| door |-----+
#       |   (0.3,1.47)->(1.05,1.47)->(2.7,1.47)  <-(4.2,1.45)<-(7.05,1.45)<-(8,1.45)
#       |  [TV]   start    [couch]    |        arch   [table +    |   ^
#       |         (0,1)               (2.7,0) <--> (4.2,0) chairs] |   |
#       |  robot (0,-1.2)                 |        |                   |
#       |  (0,-1.5)<-----------------(2.7,-1.5)   (4.2,-1.5)------->(8,-1.5)
#  y=-2 +---------- LIVING ---------------+----------- DINING -----------+
#      x=-1.4                            x=3.6                         x=8.6
#
# Every leg is at least 0.45 m from walls and furniture (the door frames are 0.45 m
# from the doorway's centre line). The lap is 44 m: about 3 min at 0.3 m/s with the
# pauses, ending in the living room near where the robot started.
human_waypoints:
  ros__parameters:
    # The person starts at (0, 1) facing north (turtlebot4_house.sdf).
    waypoints: [
       0.3,  1.47,   1.05, 1.47,  # living room: along the strip north of the couch
       1.05, 2.9,                 # north through the bedroom door
       1.7,  3.3,    1.7,  5.0,   # bedroom: a loop round its open middle
      -0.1,  5.0,   -0.1,  3.1,   #   (past the dresser)
       1.05, 2.9,    1.05, 1.47,  # back out through the bedroom door
       2.7,  1.47,   2.7,  0.0,   # round the east end of the couch
       4.2,  0.0,                 # east through the arch into the dining room
       4.2, -1.5,    8.0, -1.5,   # dining room: south of the table
       8.0,  1.45,   7.05, 1.45,  #   and up its east side
       7.05, 2.9,                 # north through the bathroom door
       6.35, 3.5,    6.35, 5.2,   # bathroom: a loop, clear of the tub
       7.3,  5.2,    7.3,  3.6,
       7.05, 2.9,    7.05, 1.45,  # back out through the bathroom door
       4.2,  1.45,   4.2,  0.0,   # dining room: north of the table
       2.7,  0.0,                 # west through the arch
       2.7, -1.5,    0.0, -1.5,   # living room: along the south wall, back to the start
    ]
    speed: 0.3
    max_turn_rate: 1.0  # rad/s
    tolerance: 0.2      # m; how close counts as reaching a waypoint
    loop: false         # true: start over after the last waypoint
    pause: 1.0          # s to stand still at each waypoint
